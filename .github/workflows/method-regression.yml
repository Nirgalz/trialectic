name: Trialectic method regression

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-regression:
    name: Deterministic regression (provisional reference model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema test validator
        run: python -m pip install -r requirements-test.txt
      - name: Compile test modules
        run: python -m compileall -q tests tools core
      - name: Run normative schema and reference regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check experimental trIA map proposal transport
        run: node applications/ai-chat-graph/test-map-protocol.cjs
      - name: Check multi-provider first-turn instructions and sessions (mock API)
        run: node applications/ai-chat-graph/test-ai-session.cjs
      - name: Check approved interactive prototype
        run: python applications/triad-graph/test_prototype.py
      - name: Check graph hierarchy constraints
        run: node applications/triad-graph/test-layout.cjs
      - name: Check French and English interface labels
        run: node applications/triad-graph/test-i18n.cjs
      - name: Check graph back and forward history
        run: node applications/triad-graph/test-graph-history.cjs
      - name: Graph view transitions
        run: node applications/triad-graph/test-view-transitions.cjs
      - name: Check Object preview metadata and placement
        run: node applications/triad-graph/test-object-preview.cjs
      - name: Check Focus navigation controls
        run: node applications/triad-graph/test-focus-navigation.cjs
      - name: Check D-97 Focus cycle and map modes
        run: node applications/triad-graph/test-focus-cycle.cjs
      - name: Compile local Work bridge
        run: python -m compileall -q applications/triad-graph/server.py applications/triad-graph/work_bridge.py applications/triad-graph/test_work_bridge.py
      - name: Check offline Work queue integrity
        run: python applications/triad-graph/test_work_bridge.py
      - name: Check Work Local UI wiring
        run: node applications/triad-graph/test_ai_ui.cjs
