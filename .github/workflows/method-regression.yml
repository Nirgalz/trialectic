name: Trialectic method regression

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-regression:
    name: Deterministic regression (provisional reference model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema test validator
        run: python -m pip install -r requirements-test.txt
      - name: Compile test modules
        run: python -m compileall -q tests tools
      - name: Run normative schema and reference regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check approved interactive prototype
        run: python applications/triad-graph/test_prototype.py
      - name: Check graph hierarchy constraints
        run: node applications/triad-graph/test-layout.cjs
      - name: Check Focus navigation controls
        run: node applications/triad-graph/test-focus-navigation.cjs
