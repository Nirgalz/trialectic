name: Publish trIA Gemini chat to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - "applications/gemini-chat/**"
      - ".github/workflows/publish-gemini-chat.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tria-gemini-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp applications/gemini-chat/index.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
